openapi: 3.0.3

info:
  title: Express App API
  version: 1.0.0
  description: Backend API documentation for the Express application.

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth/login:
    $ref: './paths/auth.yaml#/auth/login'
  /auth/refresh:
    $ref: './paths/auth.yaml#/auth/refresh'
  /auth/logout:
    $ref: './paths/auth.yaml#/auth/logout'
  /auth/oauth/google:
    $ref: './paths/auth.yaml#/auth/oauth/google'
  /auth/oauth/google/callback:
    $ref: './paths/auth.yaml#/auth/oauth/google/callback'
  /auth/oauth/github:
    $ref: './paths/auth.yaml#/auth/oauth/github'
  /auth/oauth/github/callback:
    $ref: './paths/auth.yaml#/auth/oauth/github/callback'
  /auth/oauth/accounts:
    $ref: './paths/auth.yaml#/auth/oauth/accounts'
  /auth/oauth/link/google:
    $ref: './paths/auth.yaml#/auth/oauth/link/google'
  /auth/oauth/link/github:
    $ref: './paths/auth.yaml#/auth/oauth/link/github'
  /auth/oauth/link/{provider}:
    $ref: './paths/auth.yaml#/auth/oauth/link/{provider}'

  /users:
    $ref: './paths/users.yaml#/users'

  /appointments/types:
    $ref: './paths/appointments.yaml#/appointments/types'
  /appointments/schedules:
    $ref: './paths/appointments.yaml#/appointments/schedules'
  /appointments/slots:
    $ref: './paths/appointments.yaml#/appointments/slots'
  /appointments/slots/generate:
    $ref: './paths/appointments.yaml#/appointments/slots/generate'
  /appointments/mine:
    $ref: './paths/appointments.yaml#/appointments/mine'
  /appointments:
    $ref: './paths/appointments.yaml#/appointments'
  /appointments/{id}:
    $ref: './paths/appointments.yaml#/appointments/{id}'
  /appointments/{id}/cancel:
    $ref: './paths/appointments.yaml#/appointments/{id}/cancel'
  /appointments/{id}/check-in:
    $ref: './paths/appointments.yaml#/appointments/{id}/check-in'
  /appointments/{id}/no-show:
    $ref: './paths/appointments.yaml#/appointments/{id}/no-show'
  /appointments/{id}/complete:
    $ref: './paths/appointments.yaml#/appointments/{id}/complete'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security.yaml#/bearerAuth'

  parameters:
    IdempotencyKey:
      $ref: './components/parameters.yaml#/IdempotencyKey'
    AppointmentId:
      $ref: './components/parameters.yaml#/AppointmentId'
    OAuthCode:
      $ref: './components/parameters.yaml#/OAuthCode'
    OAuthState:
      $ref: './components/parameters.yaml#/OAuthState'
    OAuthError:
      $ref: './components/parameters.yaml#/OAuthError'

  responses:
    BadRequest:
      $ref: './components/responses.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses.yaml#/NotFound'
    Conflict:
      $ref: './components/responses.yaml#/Conflict'
    ValidationError:
      $ref: './components/responses.yaml#/ValidationError'
    RateLimited:
      $ref: './components/responses.yaml#/RateLimited'

  schemas:
    ApiResponse:
      $ref: './components/schemas/common.yaml#/ApiResponse'
    MessageResponse:
      $ref: './components/schemas/common.yaml#/MessageResponse'

    LoginRequest:
      $ref: './components/schemas/auth.yaml#/LoginRequest'
    LoginResponse:
      $ref: './components/schemas/auth.yaml#/LoginResponse'
    AccessTokenResponse:
      $ref: './components/schemas/auth.yaml#/AccessTokenResponse'
    OAuthAccountsResponse:
      $ref: './components/schemas/auth.yaml#/OAuthAccountsResponse'

    User:
      $ref: './components/schemas/users.yaml#/User'
    UserResponse:
      $ref: './components/schemas/users.yaml#/UserResponse'
    UserListResponse:
      $ref: './components/schemas/users.yaml#/UserListResponse'
    CreateUserRequest:
      $ref: './components/schemas/users.yaml#/CreateUserRequest'

    CreateAppointmentTypeRequest:
      $ref: './components/schemas/appointments.yaml#/CreateAppointmentTypeRequest'
    CreateAppointmentScheduleRequest:
      $ref: './components/schemas/appointments.yaml#/CreateAppointmentScheduleRequest'
    CreateAppointmentSlotRequest:
      $ref: './components/schemas/appointments.yaml#/CreateAppointmentSlotRequest'
    GenerateAppointmentSlotsRequest:
      $ref: './components/schemas/appointments.yaml#/GenerateAppointmentSlotsRequest'
    CreateAppointmentRequest:
      $ref: './components/schemas/appointments.yaml#/CreateAppointmentRequest'
    Appointment:
      $ref: './components/schemas/appointments.yaml#/Appointment'
    AppointmentResponse:
      $ref: './components/schemas/appointments.yaml#/AppointmentResponse'
