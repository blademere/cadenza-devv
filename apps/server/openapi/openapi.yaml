openapi: 3.0.3

info:
  title: Express App API
  version: 1.0.0
  description: Backend API documentation for the Express application.

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags: [Authentication]
      summary: Refresh access token
      security: []
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: User logout
      security: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/google:
    get:
      operationId: startGoogleOAuth
      tags: [Authentication]
      summary: Start Google OAuth login
      security: []
      responses:
        '302': { description: Redirect to Google authorization }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/google/callback:
    get:
      operationId: handleGoogleOAuthCallback
      tags: [Authentication]
      summary: Handle Google OAuth callback
      security: []
      parameters:
        - { $ref: '#/components/parameters/OAuthCode' }
        - { $ref: '#/components/parameters/OAuthState' }
        - { $ref: '#/components/parameters/OAuthError' }
      responses:
        '302': { description: Redirect to configured frontend success or failure URL }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/github:
    get:
      operationId: startGithubOAuth
      tags: [Authentication]
      summary: Start GitHub OAuth login
      security: []
      responses:
        '302': { description: Redirect to GitHub authorization }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/github/callback:
    get:
      operationId: handleGithubOAuthCallback
      tags: [Authentication]
      summary: Handle GitHub OAuth callback
      security: []
      parameters:
        - { $ref: '#/components/parameters/OAuthCode' }
        - { $ref: '#/components/parameters/OAuthState' }
        - { $ref: '#/components/parameters/OAuthError' }
      responses:
        '302': { description: Redirect to configured frontend success or failure URL }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/accounts:
    get:
      operationId: listOAuthAccounts
      tags: [Authentication]
      summary: List linked OAuth accounts
      responses:
        '200':
          description: Linked OAuth accounts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/oauth/link/google:
    get:
      operationId: startGoogleOAuthLink
      tags: [Authentication]
      summary: Start Google OAuth account linking
      responses:
        '302': { description: Redirect to Google authorization }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/link/github:
    get:
      operationId: startGithubOAuthLink
      tags: [Authentication]
      summary: Start GitHub OAuth account linking
      responses:
        '302': { description: Redirect to GitHub authorization }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oauth/link/{provider}:
    delete:
      operationId: unlinkOAuthAccount
      tags: [Authentication]
      summary: Unlink an OAuth account
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        '200':
          description: OAuth account unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/types:
    get:
      operationId: listAppointmentTypes
      tags: [Appointments]
      summary: List appointment types
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Appointment types retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createAppointmentType
      tags: [Appointments]
      summary: Create an appointment type
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentTypeRequest' }
      responses:
        '201':
          description: Appointment type created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appointments/schedules:
    post:
      operationId: createAppointmentSchedule
      tags: [Appointments]
      summary: Create an appointment schedule
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentScheduleRequest' }
      responses:
        '201':
          description: Appointment schedule created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appointments/slots:
    get:
      operationId: listAppointmentSlots
      tags: [Appointments]
      summary: List appointment slots
      parameters:
        - name: appointmentTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { type: string, maxLength: 30 }
      responses:
        '200':
          description: Appointment slots retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createAppointmentSlot
      tags: [Appointments]
      summary: Create an appointment slot
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentSlotRequest' }
      responses:
        '201':
          description: Appointment slot created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appointments/slots/generate:
    post:
      operationId: generateAppointmentSlots
      tags: [Appointments]
      summary: Generate appointment slots
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateAppointmentSlotsRequest' }
      responses:
        '201':
          description: Appointment slots generated successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appointments/mine:
    get:
      operationId: listMyAppointments
      tags: [Appointments]
      summary: List the authenticated user's appointments
      responses:
        '200':
          description: User appointments retrieved successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
    OAuthCode:
      name: code
      in: query
      required: false
      schema: { type: string }
    OAuthState:
      name: state
      in: query
      required: false
      schema: { type: string }
    OAuthError:
      name: error
      in: query
      required: false
      schema: { type: string }

  responses:
    BadRequest: { description: Bad request }
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Access denied }
    Conflict: { description: Resource conflict }
    RateLimited: { description: Too many requests }
    ValidationError: { description: Validation failed }

  schemas:
    MessageResponse:
      type: object
      properties:
        message: { type: string }

    ApiResponse:
      type: object
      additionalProperties: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/User' }

    AccessTokenResponse:
      type: object
      properties:
        accessToken: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }

    UserResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer }
        limit: { type: integer }

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    OAuthAccountsResponse:
      type: object
      additionalProperties: true

    CreateAppointmentTypeRequest:
      type: object
      additionalProperties: true

    CreateAppointmentScheduleRequest:
      type: object
      additionalProperties: true

    CreateAppointmentSlotRequest:
      type: object
      additionalProperties: true

    GenerateAppointmentSlotsRequest:
      type: object
      additionalProperties: true
