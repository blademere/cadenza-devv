/health/live:
  get:
    operationId: healthLive
    tags: [Health]
    summary: Liveness health check
    security: []
    responses:
      '200':
        description: Service is alive.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'

/health/ready:
  get:
    operationId: healthReady
    tags: [Health]
    summary: Readiness health check
    security: []
    responses:
      '200':
        description: Service and dependencies are ready.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '503':
        description: One or more dependencies are unavailable.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'

/health:
  get:
    operationId: health
    tags: [Health]
    summary: Service health check
    security: []
    responses:
      '200':
        description: Service is healthy.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'

/metrics:
  get:
    operationId: metrics
    tags: [Monitoring]
    summary: Prometheus metrics
    description: Returns Prometheus metrics. Production environments require a bearer metrics token; development may expose metrics without a token when METRICS_TOKEN is unset.
    security: []
    responses:
      '200':
        description: Prometheus metrics.
        content:
          text/plain:
            schema:
              type: string
      '401':
        $ref: './components/responses.yaml#/Unauthorized'

/auth/csrf:
  get:
    operationId: getCsrfToken
    tags: [Authentication]
    summary: Issue a CSRF token
    security: []
    responses:
      '200':
        description: CSRF token issued in the response payload and cookie.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'

/auth/register:
  post:
    operationId: registerUser
    tags: [Authentication]
    summary: Register a user account
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas/auth.yaml#/RegisterRequest'
    responses:
      '201':
        description: User account created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/users.yaml#/UserResponse'
      '400':
        $ref: './components/responses.yaml#/BadRequest'
      '409':
        $ref: './components/responses.yaml#/Conflict'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/login:
  post:
    operationId: login
    tags: [Authentication]
    summary: User login
    description: Authenticates a user and returns an access token. A refresh token and CSRF token are issued through cookies.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Login successful.
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/LoginResponse'
      '400':
        $ref: './components/responses.yaml#/BadRequest'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/me:
  get:
    operationId: getCurrentUser
    tags: [Authentication]
    summary: Get the current authenticated user
    responses:
      '200':
        description: Current user retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/users.yaml#/UserResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'

/auth/refresh:
  post:
    operationId: refreshAccessToken
    tags: [Authentication]
    summary: Refresh access token
    description: Rotates the refresh token cookie and returns a new access token.
    security: []
    responses:
      '200':
        description: Access token refreshed.
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/AccessTokenResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/logout:
  post:
    operationId: logout
    tags: [Authentication]
    summary: User logout
    security: []
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Logout successful.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/MessageResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

