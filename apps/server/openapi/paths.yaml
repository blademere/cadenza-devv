/authorization/modules:
  get:
    operationId: listAuthorizationModules
    tags: [Authorization Administration]
    summary: List authorization modules
    responses:
      '200':
        description: Authorization modules retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
  post:
    operationId: createAuthorizationModule
    tags: [Authorization Administration]
    summary: Create an authorization module
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [key, name]
            properties:
              key: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9_-]*$' }
              name: { type: string, minLength: 1, maxLength: 150 }
              description: { type: string, maxLength: 500 }
    responses:
      '201':
        description: Authorization module created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '400':
        $ref: './components/responses.yaml#/BadRequest'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '409':
        $ref: './components/responses.yaml#/Conflict'

/authorization/modules/{moduleId}/permissions:
  post:
    operationId: createAuthorizationPermission
    tags: [Authorization Administration]
    summary: Add a permission to an authorization module
    parameters:
      - name: moduleId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9_-]*$' }
    responses:
      '201':
        description: Permission created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '404':
        $ref: './components/responses.yaml#/NotFound'

/authorization/modules/{moduleId}/active:
