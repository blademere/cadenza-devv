/auth/oauth/link/{provider}:
  delete:
    operationId: unlinkOAuthAccount
    tags: [Authentication]
    summary: Unlink an OAuth account
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, facebook, github]
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: OAuth account unlinked.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/MessageResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '409':
        $ref: './components/responses.yaml#/Conflict'

/users:
  get:
    operationId: listUsers
    tags: [Users]
    summary: List users
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: sortBy
        in: query
        schema: { type: string, enum: [createdAt, updatedAt, email, isActive], default: createdAt }
      - name: sortOrder
        in: query
        schema: { type: string, enum: [asc, desc], default: desc }
      - name: email
        in: query
        schema: { type: string, maxLength: 320 }
      - name: isActive
        in: query
        schema: { type: string, enum: ["true", "false"] }
    responses:
      '200':
        description: Users retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/users.yaml#/UserListResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '422':
        $ref: './components/responses.yaml#/ValidationError'
  post:
    operationId: createUser
    tags: [Users]
    summary: Create a user
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas/users.yaml#/CreateUserRequest'
    responses:
      '201':
        description: User created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/users.yaml#/UserResponse'
      '400':
        $ref: './components/responses.yaml#/BadRequest'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '409':
        $ref: './components/responses.yaml#/Conflict'

/users/{userId}/role:
  patch:
    operationId: assignUserRole
    tags: [Users]
    summary: Assign a role to a user
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
