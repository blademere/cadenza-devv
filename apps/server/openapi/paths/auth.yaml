/auth/login:
  post:
    operationId: login
    tags: [Authentication]
    summary: User login
    description: Authenticates a user and returns an access token. A refresh token and CSRF token are also issued via cookies.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/LoginResponse'
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/refresh:
  post:
    operationId: refreshAccessToken
    tags: [Authentication]
    summary: Refresh access token
    description: Exchanges the refresh token cookie for a new access token and refresh token.
    security: []
    responses:
      '200':
        description: Access token refreshed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AccessTokenResponse'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/logout:
  post:
    operationId: logout
    tags: [Authentication]
    summary: User logout
    description: Invalidates the current refresh token and clears authentication cookies.
    security: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/MessageResponse'
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/google:
  get:
    operationId: startGoogleOAuth
    tags: [Authentication]
    summary: Start Google OAuth login
    description: Redirects the browser to Google's OAuth authorization page.
    security: []
    responses:
      '302': { description: Redirect to Google authorization }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/google/callback:
  get:
    operationId: handleGoogleOAuthCallback
    tags: [Authentication]
    summary: Handle Google OAuth callback
    description: Handles the OAuth authorization callback and redirects to the configured frontend.
    security: []
    parameters:
      - { $ref: '../components/parameters.yaml#/OAuthCode' }
      - { $ref: '../components/parameters.yaml#/OAuthState' }
      - { $ref: '../components/parameters.yaml#/OAuthError' }
    responses:
      '302': { description: Redirect to the configured frontend success or failure URL }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/github:
  get:
    operationId: startGithubOAuth
    tags: [Authentication]
    summary: Start GitHub OAuth login
    description: Redirects the browser to GitHub's OAuth authorization page.
    security: []
    responses:
      '302': { description: Redirect to GitHub authorization }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/github/callback:
  get:
    operationId: handleGithubOAuthCallback
    tags: [Authentication]
    summary: Handle GitHub OAuth callback
    description: Handles the OAuth authorization callback and redirects to the configured frontend.
    security: []
    parameters:
      - { $ref: '../components/parameters.yaml#/OAuthCode' }
      - { $ref: '../components/parameters.yaml#/OAuthState' }
      - { $ref: '../components/parameters.yaml#/OAuthError' }
    responses:
      '302': { description: Redirect to the configured frontend success or failure URL }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/accounts:
  get:
    operationId: listOAuthAccounts
    tags: [Authentication]
    summary: List linked OAuth accounts
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Linked OAuth accounts retrieved
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/OAuthAccountsResponse'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }

/auth/oauth/link/google:
  get:
    operationId: startGoogleOAuthLink
    tags: [Authentication]
    summary: Start Google OAuth account linking
    security:
      - bearerAuth: []
    responses:
      '302': { description: Redirect to Google authorization }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/link/github:
  get:
    operationId: startGithubOAuthLink
    tags: [Authentication]
    summary: Start GitHub OAuth account linking
    security:
      - bearerAuth: []
    responses:
      '302': { description: Redirect to GitHub authorization }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '429': { $ref: '../components/responses.yaml#/RateLimited' }

/auth/oauth/link/{provider}:
  delete:
    operationId: unlinkOAuthAccount
    tags: [Authentication]
    summary: Unlink an OAuth account
    security:
      - bearerAuth: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github]
    responses:
      '200':
        description: OAuth account unlinked
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/MessageResponse'
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
