/auth/login:
  post:
    tags: [Authentication]
    summary: User login
    description: Authenticates a user and returns an access token. A refresh token and CSRF token are also issued via cookies.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/LoginResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'

/auth/refresh:
  post:
    tags: [Authentication]
    summary: Refresh access token
    security: []
    responses:
      '200':
        description: Access token refreshed
        content:
          application/json:
            schema:
              $ref: '../components/schemas/auth.yaml#/AccessTokenResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'

/auth/logout:
  post:
    tags: [Authentication]
    summary: User logout
    security: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/MessageResponse'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '429':
        $ref: '../components/responses.yaml#/RateLimited'
