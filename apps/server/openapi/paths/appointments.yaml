/appointments/slots:
  get:
    operationId: listAppointmentSlots
    tags: [Appointments]
    summary: List appointment slots
    security: [{ bearerAuth: [] }]
    parameters:
      - name: appointmentTypeId
        in: query
        schema: { type: string, format: uuid }
      - name: from
        in: query
        schema: { type: string, format: date-time }
      - name: to
        in: query
        schema: { type: string, format: date-time }
      - name: status
        in: query
        schema: { type: string, maxLength: 30 }
    responses:
      '200':
        description: Appointment slots retrieved successfully.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/ApiResponse' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/ValidationError' }
  post:
    operationId: createAppointmentSlot
    tags: [Appointments]
    summary: Create an appointment slot
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: '../components/parameters.yaml#/IdempotencyKey' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/appointments.yaml#/CreateAppointmentSlotRequest' }
    responses:
      '201':
        description: Appointment slot created successfully.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/ApiResponse' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/ValidationError' }

