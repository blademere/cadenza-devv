/appointments/types:
  get:
    operationId: listAppointmentTypes
    tags: [Appointments]
    summary: List appointment types
    security: [{ bearerAuth: [] }]
    parameters:
      - name: active
        in: query
        schema: { type: boolean }
    responses:
      '200':
        description: Appointment types retrieved successfully.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/ApiResponse' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/ValidationError' }
  post:
    operationId: createAppointmentType
    tags: [Appointments]
    summary: Create an appointment type
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: '../components/parameters.yaml#/IdempotencyKey' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/appointments.yaml#/CreateAppointmentTypeRequest' }
    responses:
      '201':
        description: Appointment type created successfully.
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/ApiResponse' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/ValidationError' }

