/appointments/{id}:
  get:
    operationId: getAppointment
    tags: [Appointments]
    summary: Get an appointment
    description: Returns an appointment only when the authenticated caller satisfies the appointment resource-access policy.
    security: [{ bearerAuth: [] }]
    parameters:
      - { $ref: '../components/parameters.yaml#/AppointmentId' }
    responses:
      '200':
        description: Appointment retrieved successfully.
        content:
