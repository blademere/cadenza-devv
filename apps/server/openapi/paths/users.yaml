/users:
  get:
    operationId: listUsers
    tags: [Users]
    summary: List users
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        description: Page number.
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        description: Number of users per page.
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    responses:
      '200':
        description: Users retrieved
        content:
          application/json:
            schema: { $ref: '../components/schemas/users.yaml#/UserListResponse' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    operationId: createUser
    tags: [Users]
    summary: Create user
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/users.yaml#/CreateUserRequest' }
    responses:
      '201':
        description: User created
        content:
          application/json:
            schema: { $ref: '../components/schemas/users.yaml#/UserResponse' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
