User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email

UserResponse:
  type: object
  properties:
    user:
      $ref: '#/User'

UserListResponse:
  type: object
  properties:
    users:
      type: array
      items:
        $ref: '#/User'
    page:
      type: integer
    limit:
      type: integer

CreateUserRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
