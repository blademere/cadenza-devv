BadRequest:
  description: Bad request.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiResponse'
Unauthorized:
  description: Authentication is required or the access token is invalid.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiResponse'
Forbidden:
  description: The authenticated user does not have the required permission or resource-level authorization.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiResponse'
NotFound:
  description: Requested resource was not found.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiResponse'
Conflict:
  description: The request conflicts with the current resource state or an integrity/idempotency constraint.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiResponse'
ValidationError:
  description: Request validation failed.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiResponse'
RateLimited:
  description: Too many requests.
