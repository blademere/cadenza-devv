RegisterRequest:
  type: object
  required: [email, password]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72

LoginRequest:
  type: object
  required: [email, password]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72

LoginResponse:
  type: object
  properties:
    accessToken:
      type: string
    csrfToken:
      type: string
    user:
      $ref: './users.yaml#/User'

AccessTokenResponse:
  type: object
  properties:
    accessToken:
      type: string

OAuthAccountsResponse:
  type: object
  properties:
    success:
      type: boolean
    data:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          provider:
            type: string
          createdAt:
            type: string
            format: date-time
