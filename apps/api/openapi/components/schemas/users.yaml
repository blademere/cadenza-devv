User:
  type: object
  properties:
    id:
      type: integer
    email:
      type: string
      format: email
    role:
      nullable: true
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true

UserResponse:
  type: object
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      $ref: '#/User'

UserListResponse:
  type: object
  properties:
    success:
      type: boolean
    message:
      type: string
    data:
      type: array
      items:
        $ref: '#/User'
    pagination:
      type: object
      additionalProperties: true

CreateUserRequest:
  type: object
  required: [email, roleId, password]
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
    roleId:
      type: integer
      minimum: 1
    password:
      type: string
      format: password
      minLength: 8
      maxLength: 72

AssignUserRoleRequest:
  type: object
  required: [roleId]
  additionalProperties: false
  properties:
    roleId:
      type: integer
      minimum: 1
