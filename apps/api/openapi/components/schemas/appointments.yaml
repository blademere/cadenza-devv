CreateAppointmentTypeRequest:
  type: object
  required: [key, name]
  additionalProperties: false
  properties:
    key:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[a-z0-9]+(?:[-_][a-z0-9]+)*$'
    name:
      type: string
      minLength: 1
      maxLength: 150
    description:
      type: string
      maxLength: 1000
    defaultDurationMinutes:
      type: integer
      minimum: 1
      maximum: 1440
      default: 30
    defaultCapacity:
      type: integer
      minimum: 1
      maximum: 10000
      default: 1

CreateAppointmentScheduleRequest:
  type: object
  required: [appointmentTypeId, dayOfWeek, startTime, endTime, slotDurationMinutes, capacity]
  additionalProperties: false
  properties:
    appointmentTypeId: { type: string, format: uuid }
    dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
    startTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    endTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    timezone:
      type: string
      minLength: 1
      maxLength: 100
      default: Asia/Manila
    slotDurationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    capacity: { type: integer, minimum: 1, maximum: 10000 }

CreateAppointmentSlotRequest:
  type: object
  required: [appointmentTypeId, startsAt, endsAt, capacity]
  additionalProperties: false
  properties:
    appointmentTypeId: { type: string, format: uuid }
    scheduleId: { type: string, format: uuid }
    startsAt: { type: string, format: date-time }
    endsAt: { type: string, format: date-time }
    capacity: { type: integer, minimum: 1, maximum: 10000 }

GenerateAppointmentSlotsRequest:
  type: object
  required: [appointmentTypeId, from, to]
  additionalProperties: false
  properties:
    appointmentTypeId: { type: string, format: uuid }
    scheduleId: { type: string, format: uuid }
    from: { type: string, format: date-time }
    to: { type: string, format: date-time }

CreateAppointmentRequest:
  type: object
  required: [appointmentTypeId, slotId]
  additionalProperties: false
  properties:
    appointmentTypeId: { type: string, format: uuid }
    slotId: { type: string, format: uuid }
    metadata:
      type: object
      additionalProperties: true
    notes:
      type: string
      maxLength: 2000

Appointment:
  type: object
  properties:
    id: { type: string, format: uuid }
    appointmentTypeId: { type: string, format: uuid }
    slotId: { type: string, format: uuid }
    userId: { type: string, format: uuid }
    status: { type: string }
    metadata:
      type: object
      additionalProperties: true
    notes:
      type: string
      nullable: true
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }

AppointmentResponse:
  allOf:
    - $ref: './common.yaml#/ApiResponse'
    - type: object
      properties:
        data:
          $ref: '#/Appointment'
