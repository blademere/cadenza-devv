        $ref: './components/responses.yaml#/RateLimited'

/auth/oauth/github:
  get:
    operationId: startGithubOAuth
    tags: [Authentication]
    summary: Start GitHub OAuth login
    security: []
    responses:
      '302':
        description: Redirect to the GitHub authorization endpoint.
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/oauth/github/callback:
  get:
    operationId: handleGithubOAuthCallback
    tags: [Authentication]
    summary: Handle GitHub OAuth callback
    security: []
    parameters:
      - $ref: './components/parameters.yaml#/OAuthCode'
      - $ref: './components/parameters.yaml#/OAuthState'
      - $ref: './components/parameters.yaml#/OAuthError'
    responses:
      '302':
        description: Redirect to the configured frontend success or failure URL.
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/oauth/accounts:
  get:
    operationId: listOAuthAccounts
    tags: [Authentication]
    summary: List linked OAuth accounts
    responses:
      '200':
        description: Linked OAuth accounts retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/OAuthAccountsResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'

/auth/oauth/link/google:
  get:
    operationId: startGoogleOAuthLink
    tags: [Authentication]
    summary: Start Google OAuth account linking
    responses:
      '302':
        description: Redirect to the Google authorization endpoint.
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/oauth/link/facebook:
  get:
    operationId: startFacebookOAuthLink
    tags: [Authentication]
    summary: Start Facebook OAuth account linking
    responses:
      '302':
        description: Redirect to the Facebook authorization endpoint.
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/oauth/link/github:
  get:
    operationId: startGithubOAuthLink
    tags: [Authentication]
    summary: Start GitHub OAuth account linking
    responses:
      '302':
        description: Redirect to the GitHub authorization endpoint.
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '429':
        $ref: './components/responses.yaml#/RateLimited'

/auth/oauth/link/{provider}:
  delete:
    operationId: unlinkOAuthAccount
    tags: [Authentication]
    summary: Unlink an OAuth account
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, facebook, github]
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: OAuth account unlinked.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/MessageResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '409':
        $ref: './components/responses.yaml#/Conflict'

/users:
  get:
    operationId: listUsers
    tags: [Users]
    summary: List users
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      - name: sortBy
        in: query
        schema: { type: string, enum: [createdAt, updatedAt, email, isActive], default: createdAt }
      - name: sortOrder
        in: query
        schema: { type: string, enum: [asc, desc], default: desc }
      - name: email
        in: query
        schema: { type: string, maxLength: 320 }
      - name: isActive
        in: query
        schema: { type: string, enum: ["true", "false"] }
    responses:
      '200':
        description: Users retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/users.yaml#/UserListResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '422':
        $ref: './components/responses.yaml#/ValidationError'
  post:
    operationId: createUser
    tags: [Users]
    summary: Create a user
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './components/schemas/users.yaml#/CreateUserRequest'
    responses:
      '201':
        description: User created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/users.yaml#/UserResponse'
      '400':
        $ref: './components/responses.yaml#/BadRequest'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '409':
        $ref: './components/responses.yaml#/Conflict'

/me/authorization:
  get:
    operationId: getAuthorizationContext
    tags: [Authorization]
    summary: Get the authenticated user's authorization context
    responses:
      '200':
        description: Authorization context retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'

/authorization/modules:
  get:
    operationId: listAuthorizationModules
    tags: [Authorization Administration]
    summary: List authorization modules
    responses:
      '200':
        description: Authorization modules retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
  post:
    operationId: createAuthorizationModule
    tags: [Authorization Administration]
    summary: Create an authorization module
    parameters:
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [key, name]
            properties:
              key: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9_-]*$' }
              name: { type: string, minLength: 1, maxLength: 150 }
              description: { type: string, maxLength: 500 }
    responses:
      '201':
        description: Authorization module created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '400':
        $ref: './components/responses.yaml#/BadRequest'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '409':
        $ref: './components/responses.yaml#/Conflict'

/authorization/modules/{moduleId}/permissions:
  post:
    operationId: createAuthorizationPermission
    tags: [Authorization Administration]
    summary: Add a permission to an authorization module
    parameters:
      - name: moduleId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9_-]*$' }
    responses:
      '201':
        description: Permission created.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '404':
        $ref: './components/responses.yaml#/NotFound'

/authorization/modules/{moduleId}/active:
  patch:
    operationId: setAuthorizationModuleActive
    tags: [Authorization Administration]
    summary: Enable or disable an authorization module
    parameters:
      - name: moduleId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [isActive]
            properties:
              isActive: { type: boolean }
    responses:
      '200':
        description: Module activation updated.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '404':
        $ref: './components/responses.yaml#/NotFound'

/authorization/roles:
  get:
    operationId: listAuthorizationRoles
    tags: [Authorization Administration]
    summary: List roles and permissions
    responses:
      '200':
        description: Roles and permissions retrieved.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'

/authorization/roles/{roleId}/permissions:
  put:
    operationId: replaceRolePermissions
    tags: [Authorization Administration]
    summary: Replace a role's permissions
    parameters:
      - name: roleId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - $ref: './components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [permissionIds]
            properties:
              permissionIds:
                type: array
                maxItems: 500
                items: { type: integer, minimum: 1 }
    responses:
      '200':
        description: Role permissions updated.
        content:
          application/json:
            schema:
              $ref: './components/schemas/common.yaml#/ApiResponse'
      '401':
        $ref: './components/responses.yaml#/Unauthorized'
      '403':
        $ref: './components/responses.yaml#/Forbidden'
      '404':
        $ref: './components/responses.yaml#/NotFound'

