openapi: 3.0.3

info:
  title: Express App API
  version: 1.0.0
  description: Backend API documentation for the Express application.

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticates a user and returns an access token. A refresh token and CSRF token are also issued via cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Exchanges the refresh token cookie for a new access token and refresh token.
      security: []
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Invalidates the current refresh token and clears authentication cookies.
      security: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth login
      description: Redirects the browser to Google's OAuth authorization page.
      security: []
      responses:
        '302':
          description: Redirect to Google authorization
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/google/callback:
    get:
      tags: [Authentication]
      summary: Handle Google OAuth callback
      description: Handles the OAuth authorization callback and redirects to the configured frontend.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
        - $ref: '#/components/parameters/OAuthError'
      responses:
        '302':
          description: Redirect to the configured frontend success or failure URL
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/github:
    get:
      tags: [Authentication]
      summary: Start GitHub OAuth login
      description: Redirects the browser to GitHub's OAuth authorization page.
      security: []
      responses:
        '302':
          description: Redirect to GitHub authorization
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/github/callback:
    get:
      tags: [Authentication]
      summary: Handle GitHub OAuth callback
      description: Handles the OAuth authorization callback and redirects to the configured frontend.
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
        - $ref: '#/components/parameters/OAuthError'
      responses:
        '302':
          description: Redirect to the configured frontend success or failure URL
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/accounts:
    get:
      tags: [Authentication]
      summary: List linked OAuth accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Linked OAuth accounts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/oauth/link/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth account linking
      security:
        - bearerAuth: []
      responses:
        '302':
          description: Redirect to Google authorization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/link/github:
    get:
      tags: [Authentication]
      summary: Start GitHub OAuth account linking
      security:
        - bearerAuth: []
      responses:
        '302':
          description: Redirect to GitHub authorization
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/link/{provider}:
    delete:
      tags: [Authentication]
      summary: Unlink an OAuth account
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        '200':
          description: OAuth account unlinked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /users:
    get:
      tags: [Users]
      summary: List users
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of users per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OAuthCode:
      name: code
      in: query
      required: false
      schema:
        type: string
    OAuthState:
      name: state
      in: query
      required: false
      schema:
        type: string
    OAuthError:
      name: error
      in: query
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation failed or request is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Request is not permitted or failed CSRF protection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with existing account data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secret123

    CreateUserRequest:
      type: object
      required: [email, roleId, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        roleId:
          type: integer
          minimum: 1
          example: 2
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secret123

    User:
      type: object
      description: User resource. Additional fields may be returned by the service layer.
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        roleId:
          type: integer
          example: 2

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful.
        data:
          type: object
          properties:
            accessToken:
              type: string
            csrfToken:
              type: string
            user:
              $ref: '#/components/schemas/User'

    AccessTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Access token refreshed.
        data:
          type: object
          properties:
            accessToken:
              type: string

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User created successfully.
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Users retrieved successfully.
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          description: Pagination metadata returned by the user service.
          additionalProperties: true

    OAuthAccountsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            required: [id, provider, createdAt]
            properties:
              id:
                type: integer
              provider:
                type: string
                enum: [google, github]
              createdAt:
                type: string
                format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items: {}
