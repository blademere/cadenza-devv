services:
  app:
    container_name: cadenza-app

    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace
      - /workspace/node_modules

    env_file:
      - ../.env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - '${PORT:-3000}:3000'
      - '5173:5173'

    command: sleep infinity

  db:
    container_name: cadenza-db

    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${DEV_DATABASE_NAME:-express_app}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-password}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DEV_POSTGRES_USER:-user} -d ${DEV_DATABASE_NAME:-express_app}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: cadenza-redis

    image: redis:7-alpine

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: cadenza-pgadmin

    image: dpage/pgadmin4:9

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword

    ports:
      - '8080:80'

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
