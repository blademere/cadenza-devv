services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace
      - /workspace/node_modules

    environment:
      NODE_ENV: development
      APP_NAME: ${APP_NAME:-Express App}
      APP_SLUG: ${APP_SLUG:-express-app}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${DEV_DATABASE_NAME:-express_app}
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${DEV_POSTGRES_USER:-user}:${DEV_POSTGRES_PASSWORD:-password}@db:5432/${DEV_DATABASE_NAME:-express_app}?schema=public
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-super-secret-access-token-key-min-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-token-key-min-32-chars-long}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-super-secret-oauth-state-key-min-32-chars-long}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_REFRESH_MAX_AGE_MS: ${COOKIE_REFRESH_MAX_AGE_MS:-604800000}
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - '${PORT:-3000}:${PORT:-3000}'

    command: sleep infinity

  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${DEV_DATABASE_NAME:-express_app}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-password}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DEV_POSTGRES_USER:-user} -d ${DEV_DATABASE_NAME:-express_app}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword

    ports:
      - '8080:80'

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:latest

    ports:
      - '9090:9090'

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
