services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace
      - /workspace/node_modules

    env_file:
      - ../.env

    # DATABASE_URL is intentionally supplied by ../.env via env_file.
    # Do not override it here: the app should use the configured Neon database.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - '${PORT:-3000}:${PORT:-3000}'

    command: sleep infinity

  ngrok:
    image: ngrok/ngrok:3-alpine
    env_file:
      - ../.env
    command:
      - http
      - app:3000
    depends_on:
      - app

  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${DEV_DATABASE_NAME:-express_app}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-password}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DEV_POSTGRES_USER:-user} -d ${DEV_DATABASE_NAME:-express_app}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword

    ports:
      - '8080:80'

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

  prometheus:
    image: prom/prometheus:latest

    ports:
      - '9090:9090'

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
