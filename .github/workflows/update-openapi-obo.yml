name: Update OBO OpenAPI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'docs(api): document OBO endpoints') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add OBO API paths
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/openapi.yaml')
          text = p.read_text()
          marker = '  # OBO_PLAN_PERMIT_PATHS'
          if marker in text:
              raise SystemExit('OBO paths already documented')
          block = r'''  # OBO_PLAN_PERMIT_PATHS
  /obo/permit-types:
    get:
      tags: [OBO - Permit Types]
      summary: List available OBO permit types
      operationId: listOboPermitTypes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Permit types retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /obo/permit-types/{permitTypeId}/form:
    get:
      tags: [OBO - Permit Types]
      summary: Get the published dynamic form for a permit type
      operationId: getOboPermitTypeForm
      security: [{ bearerAuth: [] }]
      parameters:
        - name: permitTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Published permit form retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /obo/professionals:
    post:
      tags: [OBO - Professionals]
      summary: Apply for professional verification with registration, PRC ID and PTR
      operationId: applyOboProfessionalVerification
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationNumber, prcId, ptrNumber]
              properties:
                registrationNumber: { type: string, minLength: 1, maxLength: 100 }
                prcId: { type: string, minLength: 1, maxLength: 100 }
                ptrNumber: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201': { description: Verification application created, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/professionals/mine:
    get:
      tags: [OBO - Professionals]
      summary: Get the authenticated user's professional verification record
      operationId: getMyOboProfessionalVerification
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Professional record retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /obo/professionals/verified:
    get:
      tags: [OBO - Professionals]
      summary: List verified professionals
      operationId: listVerifiedOboProfessionals
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Verified professionals retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /obo/professionals/pending:
    get:
      tags: [OBO - Professionals]
      summary: List pending professional verification applications
      operationId: listPendingOboProfessionals
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pending professionals retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /obo/professionals/{id}/verification:
    post:
      tags: [OBO - Professionals]
      summary: Accept or decline professional verification
      operationId: decideOboProfessionalVerification
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPTED, DECLINED] }
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Verification decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/applications:
    post:
      tags: [OBO - Plan Permits]
      summary: Create a Plan Permit application
      description: Creates a new permit application using the selected published dynamic form and verified professional. A declined application may be referenced as the source of a new replacement application.
      operationId: createOboPlanPermitApplication
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permitTypeId, professionalId, formValues]
              properties:
                permitTypeId: { type: string, format: uuid }
                professionalId: { type: string, format: uuid }
                formVersionId: { type: string, format: uuid }
                formValues: { type: object, additionalProperties: true }
                replacesApplicationId: { type: string, format: uuid, description: Previously declined application being replaced. }
      responses:
        '201': { description: Permit application created, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/applications/mine:
    get:
      tags: [OBO - Plan Permits]
      summary: List the authenticated client's Plan Permit applications
      operationId: listMyOboPlanPermitApplications
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Applications retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /obo/applications/{id}:
    get:
      tags: [OBO - Plan Permits]
      summary: Get a Plan Permit application
      operationId: getOboPlanPermitApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Application retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [OBO - Plan Permits]
      summary: Update a draft Plan Permit application
      operationId: updateOboPlanPermitApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                professionalId: { type: string, format: uuid }
                formVersionId: { type: string, format: uuid }
                formValues: { type: object, additionalProperties: true }
      responses:
        '200': { description: Application updated, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/applications/{id}/submit:
    post:
      tags: [OBO - Plan Permits]
      summary: Submit a completed Plan Permit application
      operationId: submitOboPlanPermitApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Application submitted and ready for a submission appointment, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/applications/{applicationId}/submission-appointments:
    get:
      tags: [OBO - Submission Appointments]
      summary: Get the hard-copy submission appointment for an application
      operationId: getOboSubmissionAppointment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Submission appointment retrieved, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [OBO - Submission Appointments]
      summary: Schedule a hard-copy submission appointment
      description: Reserves a configured appointment slot for delivery of the application's required hard-copy documents.
      operationId: createOboSubmissionAppointment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentTypeId, slotId]
              properties:
                appointmentTypeId: { type: string, format: uuid }
                slotId: { type: string, format: uuid }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Submission appointment scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/receiving/applications:
    get:
      tags: [OBO - Receiving]
      summary: List applications awaiting hard-copy receiving
      operationId: listOboReceivingApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [SUBMISSION_SCHEDULED] }
      responses:
        '200': { description: Applications awaiting receiving, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/receiving/applications/{id}/receive:
    post:
      tags: [OBO - Receiving]
      summary: Record receipt of the application's hard-copy documents
      operationId: receiveOboHardCopyApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Hard-copy documents received and application moved to receiving evaluation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /obo/receiving/applications/{id}/decision:
    post:
      tags: [OBO - Receiving]
      summary: Accept or decline a received Plan Permit application
      description: Accepted applications transition to FOR_INSPECTION, terminal for this workflow phase. Declined applications are terminal and must be replaced by a new application.
      operationId: decideOboPlanPermitApplication
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [ACCEPTED, DECLINED] }
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Application decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

'''
          needle = 'components:\n'
          if needle not in text:
              raise SystemExit('components section not found')
          p.write_text(text.replace(needle, block + needle, 1))
      - name: Commit OpenAPI update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/openapi.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(api): document OBO endpoints'
          git push origin HEAD:main
