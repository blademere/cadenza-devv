name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      staging:
        description: Run the ephemeral staging smoke environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      database: ${{ steps.filter.outputs.database }}
      openapi: ${{ steps.filter.outputs.openapi }}
      docker: ${{ steps.filter.outputs.docker }}
      workflow: ${{ steps.filter.outputs.workflow }}
      security: ${{ steps.filter.outputs.security }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            app=true; database=true; openapi=true; docker=true; workflow=true; security=true; docs_only=false
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"; head="${{ github.sha }}"
              if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then base="$(git rev-list --max-parents=1 "$head" | tail -n 1)"; fi
            fi
            mapfile -t files < <(git diff --name-only "$base" "$head")
            app=false; database=false; openapi=false; docker=false; workflow=false; security=false
            for file in "${files[@]}"; do
              case "$file" in
                src/**|tests/**|scripts/**|package.json|package-lock.json|eslint.config.mjs|prisma.config.ts|.env.example) app=true ;;
              esac
              case "$file" in
                prisma/**|prisma.config.ts|scripts/validate-migrations.cjs) database=true ;;
              esac
              case "$file" in
                docs/openapi.yaml|scripts/validate-openapi.cjs) openapi=true ;;
              esac
              case "$file" in
                src/**|prisma/**|Dockerfile|.dockerignore|package.json|package-lock.json|prisma.config.ts) docker=true ;;
              esac
              case "$file" in
                src/**) security=true ;;
              esac
              case "$file" in
                .github/workflows/**|.github/dependabot.yml) workflow=true ;;
              esac
            done
            docs_only=true
            for file in "${files[@]}"; do
              case "$file" in docs/**|README.md|*.md) ;; *) docs_only=false; break ;; esac
            done
          fi
          printf 'app=%s\ndatabase=%s\nopenapi=%s\ndocker=%s\nworkflow=%s\nsecurity=%s\ndocs_only=%s\n' \
            "$app" "$database" "$openapi" "$docker" "$workflow" "$security" "$docs_only" >> "$GITHUB_OUTPUT"
          echo '## CI classification' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '| Area | Required |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo "| Application | $app |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Database | $database |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OpenAPI | $openapi |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker | $docker |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow | $workflow |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security analysis | $security |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Documentation only | $docs_only |" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: express_app_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d express_app_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/express_app_test
      REDIS_URL: redis://localhost:6379
      PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:architecture
      - run: npm run validate:migrations
      - run: npx prisma validate --schema=prisma/schema.prisma
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - run: npm test
      - name: Install coverage provider
        run: npm install --no-save --no-package-lock @vitest/coverage-v8@4.1.10
      - name: Generate coverage
        run: npm run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const file = 'coverage/coverage-summary.json'
          if (!fs.existsSync(file)) { console.log('## Test coverage\n\nCoverage summary was not generated.'); process.exit(0) }
          const t = JSON.parse(fs.readFileSync(file, 'utf8')).total
          console.log('## Test coverage\n')
          console.log('| Metric | Covered | Total | Percentage |')
          console.log('|---|---:|---:|---:|')
          for (const [name, value] of Object.entries(t)) console.log(`| ${name} | ${value.covered ?? '-'} | ${value.total ?? '-'} | ${value.pct ?? '-'}% |`)
          NODE
      - uses: actions/upload-artifact@v7
        with: { name: vitest-coverage, path: coverage/, if-no-files-found: error, retention-days: 14 }

  database:
    name: Database
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: express_app_migrations }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d express_app_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/express_app_migrations
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:migrations
      - run: npx prisma validate --schema=prisma/schema.prisma
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma

  openapi:
    name: OpenAPI
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate-openapi.cjs

  docker:
    name: Docker
    needs: [changes, quality, database]
    if: >-
      always() && needs.changes.outputs.docker == 'true' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: express-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  workflow-validation:
    name: Workflow validation
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f); puts "valid: #{f}" }'

  codeql:
    name: CodeQL
    needs: changes
    if: needs.changes.outputs.security == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v4
        with: { category: /language:javascript-typescript }

  required:
    name: Required
    needs: [changes, quality, database, openapi, docker, workflow-validation, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate applicable checks
        env:
          APP: ${{ needs.changes.outputs.app }}
          DATABASE_NEEDED: ${{ needs.changes.outputs.database }}
          OPENAPI_NEEDED: ${{ needs.changes.outputs.openapi }}
          DOCKER_NEEDED: ${{ needs.changes.outputs.docker }}
          WORKFLOW_NEEDED: ${{ needs.changes.outputs.workflow }}
          SECURITY_NEEDED: ${{ needs.changes.outputs.security }}
          QUALITY: ${{ needs.quality.result }}
          DATABASE: ${{ needs.database.result }}
          OPENAPI: ${{ needs.openapi.result }}
          DOCKER: ${{ needs.docker.result }}
          WORKFLOW: ${{ needs.workflow-validation.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          check() {
            local name="$1" needed="$2" result="$3"
            if [[ "$needed" == true && "$result" != success ]]; then
              echo "$name was required but finished with: $result"
              exit 1
            fi
            if [[ "$needed" == false && "$result" != skipped ]]; then
              echo "$name was not required but finished with: $result"
              exit 1
            fi
            echo "$name: $result (needed=$needed)"
          }
          check Quality "$APP" "$QUALITY"
          check Database "$DATABASE_NEEDED" "$DATABASE"
          check OpenAPI "$OPENAPI_NEEDED" "$OPENAPI"
          check Docker "$DOCKER_NEEDED" "$DOCKER"
          check Workflow "$WORKFLOW_NEEDED" "$WORKFLOW"
          check CodeQL "$SECURITY_NEEDED" "$CODEQL"
          echo 'All applicable CI checks passed.'

  staging:
    name: Staging
    needs: docker
    if: github.event_name == 'workflow_dispatch' && inputs.staging && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: express_app_staging }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d express_app_staging"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t express-app:staging .
      - name: Start staging container
        run: |
          docker run -d --name express-app-staging --network host \
            -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/express_app_staging \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e CORS_ORIGIN=https://staging.example.invalid \
            -e JWT_ACCESS_SECRET=staging-access-secret-012345678901234567890123 \
            -e JWT_REFRESH_SECRET=staging-refresh-secret-012345678901234567890123 \
            -e METRICS_TOKEN=staging-metrics-token-012345678901234567890123 \
            -e COOKIE_SECURE=true -e COOKIE_SAME_SITE=lax \
            -e COOKIE_REFRESH_MAX_AGE_MS=604800000 express-app:staging
      - name: Wait for liveness
        run: |
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:3000/health/live && exit 0 || sleep 2; done
          docker logs express-app-staging; exit 1
      - name: Verify production docs are disabled
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/docs)" = "404"
      - name: Verify metrics authentication
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/metrics)" = "401"
      - name: Cleanup staging container
        if: always()
        run: docker logs express-app-staging || true; docker rm -f express-app-staging || true
