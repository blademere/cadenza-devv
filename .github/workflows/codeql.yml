name: CodeQL

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Perform CodeQL analysis
        id: codeql-analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
      - name: Warn when CodeQL upload is unavailable
        if: steps.codeql-analysis.outcome == 'failure'
        run: |
          echo "::warning::CodeQL analysis completed, but uploading code scanning results is unavailable because code scanning is not enabled for this repository."
