name: Prisma 7 bootstrap

on:
  push:
    branches:
      - agent/migrate-prisma-7-runtime

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Update Prisma 7 schema and lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("prisma/schema.prisma")
          text = path.read_text()
          old = '  url      = env("DATABASE_URL")\n'
          if old not in text:
              raise SystemExit("Expected Prisma 6 datasource URL line was not found")
          path.write_text(text.replace(old, "", 1))
          PY
          npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Commit generated dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "refactor(prisma): complete Prisma 7 migration"
          git push
