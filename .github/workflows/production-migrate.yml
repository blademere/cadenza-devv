name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE to approve the production migration
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.confirm == 'MIGRATE'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run prisma:migrate:deploy

      - name: Record migration completion
        run: echo "Production migrations completed for ${GITHUB_SHA}"
